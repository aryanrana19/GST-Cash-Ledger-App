<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST Cash Ledger - ML Reports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment"></script>
    <link rel="stylesheet" href="../Css/ml-styles.css">
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-chart-line"></i> GST Cash Ledger - Predictive Insights</h1>
        <a href="index.html" class="back-btn"> Back to Transactions</a>
    </div>

    <div id="loading" class="loading">
        <i class="fas fa-spinner fa-spin"></i> Generating predictive insights...
    </div>

    <div id="content" style="display: none;">
        <div class="insights-container">
            <div class="insight-card">
                <h3><i class="fas fa-lightbulb"></i> Key Insight #1</h3>
                <p id="insight1">Loading...</p>
            </div>
            <div class="insight-card">
                <h3><i class="fas fa-lightbulb"></i> Key Insight #2</h3>
                <p id="insight2">Loading...</p>
            </div>
            <div class="insight-card">
                <h3><i class="fas fa-lightbulb"></i> Key Insight #3</h3>
                <p id="insight3">Loading...</p>
            </div>
        </div>

        <div class="visualization-container">
            <div class="chart-container">
                <h2 class="chart-title">Cash Flow Forecast (Next 3 Months)</h2>
                <canvas id="cashFlowChart"></canvas>
            </div>
    
            <div class="chart-container">
                <h2 class="chart-title">GST Liability Forecast</h2>
                <canvas id="gstChart"></canvas>
            </div>
    
            <div class="chart-container">
                <h2 class="chart-title">Expense Category Trends</h2>
                <canvas id="categoryChart"></canvas>
            </div>

        </div>
    </div>

    <script src="../js/ml-visualization.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const visualizer = new MLVisualizer();
            visualizer.init().then(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            });
        });
    </script>
</body>
</html>
