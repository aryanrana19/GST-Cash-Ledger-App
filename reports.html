<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Expense Tracker - Data Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="reports.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Data Visualization Dashboard</h1>
            <!-- <p>Data Visualization Dashboard</p> -->
        </div>

        <div class="time-filter">
            <button class="filter-btn active" data-period="all">All Time</button>
            <button class="filter-btn" data-period="month">This Month</button>
            <button class="filter-btn" data-period="quarter">Last 3 Months</button>
            <button class="filter-btn" data-period="year">This Year</button>
        </div>

        <div class="summary-container">
            <div class="summary-grid">
                <div class="summary-box balance">
                    <div class="summary-title">Total Balance</div>
                    <div class="summary-value" id="summary-balance">₹0.00</div>
                </div>
                <div class="summary-box income">
                    <div class="summary-title">Total Income</div>
                    <div class="summary-value" id="summary-income">₹0.00</div>
                </div>
                <div class="summary-box expense">
                    <div class="summary-title">Total Expenses</div>
                    <div class="summary-value" id="summary-expense">₹0.00</div>
                </div>
                <div class="summary-box gst">
                    <div class="summary-title">Total GST</div>
                    <div class="summary-value" id="summary-gst">₹0.00</div>
                </div>
            </div>
        </div>

        <div class="dashboard">
            <div class="chart-container">
                <div class="chart-title">Income vs Expenses</div>
                <canvas id="incomeVsExpenseChart"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title">Expense Categories</div>
                <canvas id="categoryChart"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title">Balance Trend</div>
                <canvas id="balanceTrendChart"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title">GST by Category</div>
                <canvas id="gstByCategory"></canvas>
            </div>
        </div>
    </div>

    <script src="chart.js"></script>
</body>
</html>
